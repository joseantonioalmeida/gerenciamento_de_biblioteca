services:
  biblioteca_database:
    image: postgres:17
    container_name: biblioteca_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: antonio_book
      POSTGRES_PASSWORD: book333
      POSTGRES_DB: biblioteca_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antonio_book -d biblioteca_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  biblioteca_api:
    image: biblioteca_api
    build: .
    restart: unless-stopped
    depends_on:
      biblioteca_database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://antonio_book:book333@biblioteca_database:5432/biblioteca_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
  redis:
    image: redis:7-alpine
    container_name: biblioteca_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: biblioteca_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - biblioteca_api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: biblioteca_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data: