services:
  biblioteca_database:
    image: postgres:17
    container_name: biblioteca_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: antonio_book
      POSTGRES_PASSWORD: book333
      POSTGRES_DB: biblioteca_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antonio_book -d biblioteca_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  biblioteca_api:
    image: biblioteca_api
    build: .
    restart: unless-stopped
    depends_on:
      biblioteca_database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://antonio_book:book333@biblioteca_database:5432/biblioteca_db
    ports:
      - "8000:8000"

volumes:
  postgres_data: