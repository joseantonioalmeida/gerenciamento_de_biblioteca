
[project]
name = "gerenciamento-de-biblioteca"
version = "0.0.1"
description = "Sistema de gerenciamento de biblioteca desenvolvido com Python 3.14"
readme = "README.md"
license = "MIT"
authors = [{ name = "José Antônio", email = "joseantonioalmeida217@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[project.urls]
Homepage = "https://github.com/joseantonioalmeida/gerenciamento-de-biblioteca"

[project.scripts]
biblioteca = "gerenciamento_de_biblioteca.main:app"

# ============================
# Lint e formatação (Ruff)
# ============================
[tool.ruff]
line-length = 79
target-version = "py314"
fix = true
show-fixes = true
indent-width = 4
exclude = [
    "venv",
    ".venv",
    "env",
    ".env",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "migrations",
]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT", "FAST"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
# Ensina ao Ruff qual é o pacote principal do seu projeto.
# Deve ser o mesmo nome da pasta dentro de 'src/'.
known-first-party = ["gerenciamento_de_biblioteca"]


# ============================
# Tipagem (Pyright)
# ============================
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["src", "tests"]
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

# ============================
# Testes (Pytest)
# ============================
[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
# Adiciona 'src' ao path do Python durante os testes. Isso permite que
# os testes em `tests/` importem os módulos de `src/` sem erros.
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


# ============================
# Build e Setuptools
# ============================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pyright",
    "ruff",
    "pytest-asyncio",
    "taskipy",
    "factory-boy",
    "freezegun",
    "testcontainers[postgres]",
]

[tool.setuptools.packages.find]
# Informa ao setuptools para encontrar os pacotes dentro da pasta 'src'.
# Essencial para a estrutura de layout com 'src/'.
where = ["src"]

[tool.setuptools]
# Mapeia o diretório raiz de pacotes para 'src'.
package-dir = { "" = "src" }


[tool.coverage.run]
source = ["src/gerenciamento_de_biblioteca"]
branch = true
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.taskipy.tasks]

lint = "ruff check . --fix"
format = "ruff format ."
pyright = "pyright"

pre_test = "task lint"
test = "pytest -x -s --cov=gerenciamento_de_biblioteca -vv"
post_test = "coverage html"

coverage = 'explorer.exe "$(wslpath -w htmlcov/index.html)"'

#Uvicorn
serve = "uvicorn gerenciamento_de_biblioteca.main:app --host 0.0.0.0 --port 8000"

# Alembic
migrate = "alembic upgrade head"
makemigrations = "alembic revision --autogenerate"

# Docker
downgrade = "alembic downgrade -1"
docker = "docker compose up --build"
docker_down = "docker compose down"
